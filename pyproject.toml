[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto5-engine-conformidade-ecommerce"
version = "0.1.0"
description = "Projeto 5 — Engine de Conformidade Regulatória para E-Commerce e Consumidor Digital"
requires-python = ">=3.12,<3.13"
dependencies = ["Django>=5.2,<5.3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-django>=4.11,<5", "coverage>=7.6,<8", "ruff>=0.11,<1"]

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests", "src/apps"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/apps/accounts/migrations"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/asgi.py", "*/wsgi.py"]
[tool.coverage.report]
show_missing = true
skip_covered = true
